<title>Anna &amp; David — September 5</title>
<style>

  @font-face{
    font-family:'Editors Note';
    src:url('fonts/EditorsNote-Regular.otf') format('opentype');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Editors Note';
    src:url('fonts/EditorsNote-Italic.otf') format('opentype');
    font-weight:400;
    font-style:italic;
    font-display:swap;
  }
  @font-face{
    font-family:'Editors Note';
    src:url('fonts/EditorsNote-Medium.otf') format('opentype');
    font-weight:500;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Editors Note';
    src:url('fonts/EditorsNote-MediumItalic.otf') format('opentype');
    font-weight:500;
    font-style:italic;
    font-display:swap;
  }

  :root{
    --cream:#FAF7F0;
    --paper:#FFFFFF;
    --ink:#2E2C26;
    --ink-soft:#726F63;
    --sage:#8DA284;
    --sage-deep:#5C6E52;
    --gold:#C9A66B;
    --gold-text:#8A6530;
    --line:#E4E0D3;
    --line-soft:#EFEBE0;
    --done-bg:#F1F3EE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .serif{ font-family:'Fraunces', serif; }

  /* ---------- shell ---------- */
  .shell{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:0 0 84px 0;
    position:relative;
  }

  /* ---------- header / arch ---------- */
  .arch-header{
    background:linear-gradient(180deg, #455440 0%, #5C6E52 100%);
    padding:38px 24px 46px 24px;
    text-align:center;
    color:#FDFCF9;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:601px){
    .arch-header{
      width:100vw;
      left:50%;
      right:50%;
      margin-left:-50vw;
      margin-right:-50vw;
    }
  }

    background-size:cover;
    background-position:center 62%;
  }
  .arch-header .eyebrow{
    font-family:'Fraunces', serif;
    letter-spacing:0.06em;
    font-size:14px;
    font-style:italic;
    color:rgba(253,252,249,0.8);
    margin-bottom:8px;
  }
  .arch-header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    text-transform:uppercase;
    font-size:40px;
    line-height:1.05;
    margin:0 0 6px 0;
    letter-spacing:0.01em;
  }
  .arch-header .sub{
    font-size:15px;
    color:rgba(253,252,249,0.92);
  }
  .entry-hero .eyebrow,
  .entry-hero h1,
  .entry-hero .sub{
    font-family:'Editors Note', serif;
  }

  /* ---------- content pad ---------- */
  .content{ padding:22px 20px 0 20px; }

  /* ---------- role picker ---------- */
  .picker-intro{
    text-align:center;
    margin-bottom:18px;
  }
  .picker-intro h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:25px;
    margin:0 0 4px 0;
    color:var(--sage-deep);
  }
  .picker-intro p{
    font-size:15px;
    color:var(--ink-soft);
    margin:0;
  }
  .compare-pill-wrap{
    text-align:center;
    margin:0 0 18px 0;
  }
  a.compare-pill{
    display:inline-block;
    background:transparent;
    color:var(--sage-deep);
    border:1.5px solid var(--sage-deep);
    border-radius:999px;
    padding:8px 16px;
    font-family:'Karla', sans-serif;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
  }
  .group-label{
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin:22px 0 10px 4px;
    font-weight:500;
  }
  .card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .person-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .person-card:active{ transform:scale(0.97); }
  .person-card:hover{ border-color:var(--sage); box-shadow:0 4px 14px rgba(92,110,82,0.12); }
  .person-card .name{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    line-height:1.15;
  }
  .person-card .role{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:0.02em;
  }
  .person-card.wide{ grid-column:1 / -1; }

  /* ---------- personal view ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--sage-deep);
    font-size:14.5px;
    font-family:'Karla', sans-serif;
    cursor:pointer;
    padding:6px 0;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .banner{
    background:#FBF6E9;
    border:1px solid #EAD9A8;
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    color:#7A5F1E;
    margin:16px 0;
    line-height:1.5;
  }
  .banner b{ color:#5C4413; }

  .note-link-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin:16px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .note-link-card:hover{ border-color:var(--sage); background:var(--done-bg); }
  .note-link-card .note-link-title{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    color:var(--sage-deep);
  }
  .note-link-card .note-link-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .note-link-card .note-link-arrow{
    font-size:19px;
    color:var(--sage-deep);
    flex-shrink:0;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(46,44,38,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
    padding:0;
  }
  .modal-box{
    background:var(--paper);
    width:100%;
    max-width:480px;
    max-height:85vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:22px 20px 30px 20px;
    box-shadow:0 -4px 24px rgba(0,0,0,0.15);
  }
  @media(min-width:520px){
    .modal-overlay{ align-items:center; padding:20px; }
    .modal-box{ border-radius:18px; }
  }
  .modal-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:4px;
  }
  .modal-title{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .modal-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:2px 0 18px 0;
  }
  .modal-close{
    width:28px;height:28px;
    min-width:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .modal-close:hover{ border-color:var(--sage); color:var(--sage-deep); }
  .modal-section{ margin-top:20px; }
  .modal-section:first-of-type{ margin-top:0; }
  .modal-section-title{
    font-family:'Karla', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--sage-deep);
    margin-bottom:8px;
  }
  .modal-section p{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.55;
    margin:0 0 6px 0;
  }
  .modal-route-time{
    font-weight:600;
    color:var(--gold-text);
  }
  .modal-map-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:14px;
    color:var(--sage-deep);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--sage);
    padding-bottom:1px;
    margin-top:6px;
  }
  .modal-map-link:hover{ color:var(--sage-deep); }
  .modal-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .modal-list li{
    font-size:14.5px;
    color:var(--ink);
    padding:8px 2px;
    border-bottom:1px solid var(--line-soft);
    display:flex;
    align-items:center;
    gap:9px;
  }
  .modal-list li:last-child{ border-bottom:none; }
  .modal-list li::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--sage);
    flex-shrink:0;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:600;
    color:var(--sage-deep);
    margin:26px 0 10px 2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count-pill{
    font-family:'Karla', sans-serif;
    font-size:12.5px;
    background:var(--sage-deep);
    color:#fff;
    border-radius:999px;
    padding:2px 9px;
    font-weight:500;
  }

  .task{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
    margin-bottom:8px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    transition:background .2s ease, opacity .2s ease;
  }
  .task .time{
    font-family:'Karla', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--sage-deep);
    min-width:52px;
    padding-top:2px;
    letter-spacing:0.01em;
  }
  .task .checkbox{
    width:20px;height:20px;
    min-width:20px;
    border-radius:50%;
    border:1.5px solid var(--sage);
    cursor:pointer;
    margin-top:1px;
    margin-left:auto;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
    background:#fff;
  }
  .task .checkbox.checked{
    background:var(--sage);
  }
  .task .checkbox svg{ width:11px; height:11px; opacity:0; transition:opacity .1s ease; }
  .task .checkbox.checked svg{ opacity:1; }
  .task .body{ flex:1; }
  .task .title{
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    line-height:1.35;
  }
  .task .note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.4;
  }
  /* Addresses inside a note open in Maps. Only the checkbox marks a task done,
     so a link in here doesn't steal that tap. */
  .note-map{
    display:inline-block;
    margin-top:3px;
    color:var(--sage-deep);
    font-weight:600;
    text-decoration:none;
  }
  .note-map:hover{ text-decoration:underline; }
  /* Arrow lives in CSS so the print sheet can drop it and leave a plain address. */
  .note-map::before{ content:'\2197'; margin-right:3px; }
  .task.done{ background:var(--done-bg); }
  .task.done .title{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }

  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .empty-state .serif{ font-size:22px; color:var(--sage-deep); display:block; margin-bottom:6px; }

  .archive-toggle{
    width:100%;
    background:none;
    border:1px dashed var(--line);
    border-radius:12px;
    padding:11px;
    color:var(--ink-soft);
    font-family:'Karla', sans-serif;
    font-size:14px;
    cursor:pointer;
    margin-top:6px;
  }
  .archive-toggle:hover{ border-color:var(--sage); color:var(--sage-deep); }
  .archive-toggle{ margin-bottom:6px; }

  footer.note{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:30px 20px 10px 20px;
    line-height:1.6;
  }

  /* ---------- compare view ---------- */
  .compare-shell{
    max-width:100%;
    min-height:100dvh;
    height:100dvh;
    max-height:100dvh;
    background:var(--cream);
    padding-bottom:76px;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  .compare-shell > :not(.compare-scroll){
    flex-shrink:0;
  }
  .compare-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 16px 10px 16px;
    background:var(--cream);
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .compare-title{
    font-size:22px;
    font-weight:600;
    color:var(--sage-deep);
    min-width:0;
  }
  .compare-scroll{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 0 12px 0;
    flex:1;
    min-height:0;
  }
  table.compare-table{
    display:grid;
    grid-template-columns:62px repeat(var(--cols, 1), minmax(120px, 1fr));
    width:max-content;
    min-width:100%;
  }
  .compare-table thead,
  .compare-table tbody,
  .compare-table tr{
    display:contents;
  }
  .compare-table th, .compare-table td{
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    padding:8px 8px;
    vertical-align:top;
    background:var(--paper);
  }
  .compare-table th:not(.time-col), .compare-table td:not(.time-col){
    min-width:120px;
  }
  .compare-table thead th{
    position:sticky;
    top:0;
    background:var(--sage-deep);
    color:#fff;
    z-index:3;
    text-align:left;
    padding:10px 8px;
    box-shadow:0 1px 0 rgba(46,44,38,0.12);
  }
  .compare-table thead th .col-name{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    line-height:1.2;
  }
  .compare-table thead th .col-role{
    font-size:11px;
    color:rgba(255,255,255,0.92);
    margin-top:1px;
  }
  .compare-table td.time-col, .compare-table th.time-col{
    position:sticky;
    left:0;
    z-index:2;
    background:var(--cream);
    font-weight:600;
    font-size:13px;
    color:var(--sage-deep);
    min-width:62px;
    max-width:62px;
  }
  .compare-table thead th.time-col{
    z-index:4;
    top:0;
    background:var(--sage-deep);
    color:#fff;
  }
  @media (min-width: 640px){
    .compare-scroll{
      container-type:inline-size;
    }
    table.compare-table{
      --time-col-w:74px;
      --person-col-w:max(140px, calc((100cqw - var(--time-col-w)) / 6));
      grid-template-columns:var(--time-col-w) repeat(var(--cols, 1), var(--person-col-w));
    }
    .compare-table th:not(.time-col), .compare-table td:not(.time-col){
      min-width:140px;
    }
    .compare-table td.time-col, .compare-table th.time-col{
      min-width:74px;
      max-width:74px;
    }
  }
  .compare-table thead th.hdr-bridesmaids{ background:#C9707F; }
  .compare-table thead th.hdr-groomsmen{ background:#4E7BA6; }
  .compare-table thead th.hdr-vendors{ background:#22201B; }
  .compare-table td{
    display:flex;
    flex-direction:column;
  }
  .mini-card{
    background:var(--done-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 7px;
    font-size:12.5px;
    color:var(--ink);
    margin-bottom:4px;
    line-height:1.3;
    word-break:break-word;
  }
  .compare-table td .mini-card:only-child{
    flex:1;
    margin-bottom:0;
  }
  .mini-card.mini-done{
    opacity:0.45;
    text-decoration:line-through;
  }
  .mini-card .mini-note{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
    font-weight:400;
    line-height:1.35;
  }

  .compare-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  /* On narrow phones the export button goes icon-only so the title stays on one line. */
  @media (max-width: 400px){
    .export-pdf .btn-label{ display:none; }
  }
  .manage-toggle{
    flex-shrink:0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    color:var(--sage-deep);
    font-family:'Karla', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:0;
    display:flex;
    align-items:center;

  .print-root{ display:none; }

    .print-role{ font-size:7pt; color:rgba(255,255,255,0.92); }
    .print-table .print-time{

    .print-card{ font-size:8pt; line-height:1.25; margin-bottom:2pt; }

    .print-note .note-map{ display:inline; margin-top:0; color:inherit; font-weight:inherit; }
    .print-note .note-map::before{ content:none; }
  }
</style>

function loadPrefs(){
  try{ prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }catch(e){ prefs = {}; }

  if(typeof prefs.compareManageOpen === 'boolean') compareManageOpen = prefs.compareManageOpen;
  if(typeof prefs.compareTimeCutoffIndex === 'number') compareTimeCutoffIndex = prefs.compareTimeCutoffIndex;
  if(Array.isArray(prefs.compareOrder)) compareOrder = prefs.compareOrder;
  if(Array.isArray(prefs.compareVisible)) compareVisible = new Set(prefs.compareVisible);
}
function savePref(key, value){
  prefs[key] = value;

}

function loadCompleted(){

    if(raw){ completed = JSON.parse(raw); }
  }catch(e){ completed = {}; }
}
function saveCompleted(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(completed)); }catch(e){ /* ignore */ }
}

function personById(id){ return PEOPLE.find(p=>p.id===id); }

function hashRoute(){
  return decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
}

function applyRoute(){
  const h = hashRoute();
  if(h==='compare'){
    stage = 'compare';
  } else if(h==='contacts'){
    stage = 'contacts';
  } else if(h==='cars'){
    stage = 'cars';
  } else if(h==='cars/drivers'){
    stage = 'drivers';
  } else if(h==='cars/shuttle'){
    stage = 'shuttle';
  } else if(h==='more'){
    stage = 'more';
  } else if(h && personById(h) && !personById(h).contactOnly){
    stage = 'personal';
    if(currentPerson !== h){ showDongNote = false; showPackingList = false; }
    currentPerson = h;
  } else {
    stage = 'picker';
    currentPerson = null;
    showDongNote = false;
    showPackingList = false;
  }
  if(stage !== 'more'){ showFloorPlan = false; showAllergies = false; }
}

function go(hash){
  const nextHash = hash ? '#'+hash : '';
  if((location.hash || '') === nextHash){
    applyRoute();
    render();
    return;
  }
  const url = hash ? '#'+hash : (location.pathname + location.search);
  history.pushState({hash: hash||''}, '', url);
  applyRoute();
  render();
  window.scrollTo(0,0);
}

window.addEventListener('popstate', ()=>{
  applyRoute();
  render();
  window.scrollTo(0,0);
});

function tasksFor(personId){
  return TASKS.filter(t => t.people.includes(personId));
}

function orderedTimeLabels(){
  const seen = new Set();
  const labels = [];
  TASKS.forEach(t=>{ if(!seen.has(t.time)){ seen.add(t.time); labels.push(t.time); } });
  return labels;
}

/* ---- compare view state ---- */
let compareOrder = null;      // array of person ids, in display order
let compareVisible = null;    // Set of visible person ids
let compareManageOpen = false;
let compareTimeCutoffIndex = 0; // hide time rows before this index in orderedTimeLabels()

function defaultCompareOrder(){
  const idsInGroup = (group)=> PEOPLE.filter(p=>p.group===group).map(p=>p.id);
  const preferred = [
    'anna',
    'david',
    'guest',
    'planner',
    ...idsInGroup('Bridesmaids'),
    ...idsInGroup('Groomsmen'),
    'photovideo', // Estelle & Team
    'dj',         // Justin
    'mc',         // Ken
    'mua',        // Sherry
    'florist',    // Watering Can
    'photobooth', // Chronobooth
    'liveperf',   // Vanessa & Dickson
    ...idsInGroup('Parents'),
    'mimi',
  ];
  const seen = new Set();
  const order = [];
  preferred.forEach(id=>{
    if(PEOPLE.some(p=>p.id===id) && !seen.has(id)){
      seen.add(id);
      order.push(id);
    }
  });
  PEOPLE.forEach(p=>{
    if(!seen.has(p.id) && !p.contactOnly) order.push(p.id);
  });
  return order;
}

function initCompareState(){
  if(compareOrder===null){
    compareOrder = defaultCompareOrder();
  }
  if(compareVisible===null){
    compareVisible = new Set(compareOrder);
  }
}

function compareIdsInGroup(group){
  return compareOrder.filter(id=>personById(id)?.group===group);
}

function renderManagePersonRow(id, nested){
  const p = personById(id);
  const on = compareVisible.has(id);
  return `
        <div class="manage-row${nested?' nested':''}" data-id="${id}">
          <div class="drag-handle" title="Drag to reorder">&#8942;&#8942;</div>
          <label class="manage-check">
            <input type="checkbox" data-id="${id}" class="visToggle" ${on?'checked':''}/>
            <span class="${on?'':'manage-off'}">${p.name}<span class="manage-role"> — ${p.role}</span></span>
          </label>
        </div>`;
}

function renderManageGroup(group){
  const ids = compareIdsInGroup(group);
  if(!ids.length) return '';
  const nOn = ids.filter(id=>compareVisible.has(id)).length;
  return `
        <div class="manage-block" data-group="${group}">
          <div class="manage-group-head">
            <div class="drag-handle" title="Drag to reorder">&#8942;&#8942;</div>
            <label class="manage-check">
              <input type="checkbox" class="groupToggle" data-group="${group}" ${nOn===ids.length?'checked':''}/>
              <span class="${nOn===0?'manage-off':''}">${group}</span>
            </label>
          </div>
          ${ids.map(id=>renderManagePersonRow(id, true)).join('')}
        </div>`;
}

/* ---- Export as PDF ----
   Six people per landscape page keeps the columns wide enough to read.
   Whatever the Filter panel is hiding stays out of the export too. */
const PRINT_PEOPLE_PER_PAGE = 6;

function buildPrintPages(){
  initCompareState();
  const labels = orderedTimeLabels().filter((label,idx)=>idx >= compareTimeCutoffIndex);
  const visibleOrder = compareOrder.filter(id=>compareVisible.has(id));

  const chunks = [];
  for(let i=0; i<visibleOrder.length; i+=PRINT_PEOPLE_PER_PAGE){
    chunks.push(visibleOrder.slice(i, i+PRINT_PEOPLE_PER_PAGE));
  }
  if(chunks.length===0) chunks.push([]);

  return chunks.map((ids, pageIdx)=>{
    const head = ids.map(id=>{
      const p = personById(id);
      return `<th class="${compareHeaderClass(p)}"><div class="print-name">${p.shortName || p.name}</div><div class="print-role">${p.role}</div></th>`;
    }).join('');
    const body = labels.map(label=>{
      const cells = ids.map(id=>{
        const cellTasks = TASKS.filter(t=>t.time===label && t.people.includes(id));
        return `<td>${cellTasks.map(t=>`<div class="print-card${completed[t.id] ? ' print-done' : ''}">${t.title}${t.note ? `<div class="print-note">${t.note}</div>` : ''}</div>`).join('')}</td>`;
      }).join('');
      return `<tr><td class="print-time">${label}</td>${cells}</tr>`;
    }).join('');
    return `
      <section class="print-page">
        <div class="print-header">
          <div class="print-title">Anna &amp; David — Everyone's Schedule</div>
          <div class="print-meta">Saturday, September 5 · Lincoln Estate · Page ${pageIdx+1} of ${chunks.length}</div>
        </div>
        <table class="print-table">
          <thead><tr><th class="print-time">Time</th>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </section>`;
  }).join('');
}

function exportScheduleAsPdf(){
  let printRoot = document.getElementById('printRoot');
  if(!printRoot){
    printRoot = document.createElement('div');
    printRoot.id = 'printRoot';
    printRoot.className = 'print-root';
    document.body.appendChild(printRoot);
  }
  printRoot.innerHTML = buildPrintPages();
  const cleanup = ()=>{
    printRoot.innerHTML = '';
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.print();
}

function attachCompareHandlers(){
  document.getElementById('manageToggle').addEventListener('click', ()=>{
    compareManageOpen = !compareManageOpen;
    savePref('compareManageOpen', compareManageOpen);
    render();
  });
  const exportBtn = document.getElementById('exportPdf');
  if(exportBtn) exportBtn.addEventListener('click', exportScheduleAsPdf);
  const timeSlider = document.getElementById('timeFilterSlider');
  if(timeSlider){
    const timeLabels = orderedTimeLabels();
    const timeValueEl = document.getElementById('timeFilterValue');
    const timeWrap = document.getElementById('timeFilterWrap');
    const maxIdx = Math.max(timeLabels.length-1, 0);
    const updatePct = (idx)=>{
      const pct = maxIdx>0 ? (idx/maxIdx*100) : 0;
      if(timeWrap) timeWrap.style.setProperty('--pct', pct+'%');
    };
    timeSlider.addEventListener('input', ()=>{
      const idx = parseInt(timeSlider.value, 10);
      if(timeValueEl) timeValueEl.textContent = idx===0 ? 'Start of day' : timeLabels[idx];
      updatePct(idx);
    });
    timeSlider.addEventListener('change', ()=>{
      compareTimeCutoffIndex = parseInt(timeSlider.value, 10);
      savePref('compareTimeCutoffIndex', compareTimeCutoffIndex);
      render();
    });
  }
  const managePanelDoneBtn = document.getElementById('managePanelDone');
  if(managePanelDoneBtn){
    managePanelDoneBtn.addEventListener('click', ()=>{
      compareManageOpen = false;
      savePref('compareManageOpen', compareManageOpen);
      render();
    });
  }
  document.querySelectorAll('.visToggle').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-id');
      if(el.checked){ compareVisible.add(id); } else { compareVisible.delete(id); }
      savePref('compareVisible', [...compareVisible]);
      render();
    });
  });
  document.querySelectorAll('.groupToggle').forEach(el=>{
    const group = el.getAttribute('data-group');
    const ids = compareIdsInGroup(group);
    const nOn = ids.filter(id=>compareVisible.has(id)).length;
    el.indeterminate = nOn>0 && nOn<ids.length;
    el.addEventListener('change', ()=>{
      ids.forEach(id=>{
        if(el.checked) compareVisible.add(id);
        else compareVisible.delete(id);
      });
      savePref('compareVisible', [...compareVisible]);
      render();
    });
  });

  let dragEl = null;
  const bindDrag = (handle, unit)=>{
    handle.style.touchAction = 'none';
    handle.addEventListener('pointerdown', (e)=>{
      dragEl = unit;
      unit.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    });
    handle.addEventListener('pointermove', (e)=>{
      if(!dragEl) return;
      e.preventDefault();
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const container = dragEl.parentElement;
      if(!target || !container) return;
      let targetEl = null;
      if(dragEl.classList.contains('manage-block')){
        targetEl = target.closest('.manage-block, .manage-panel-body > .manage-row');
        if(targetEl && targetEl.classList.contains('manage-row') && targetEl.closest('.manage-block')){
          targetEl = targetEl.closest('.manage-block');
        }
      } else {
        targetEl = target.closest('.manage-row');
      }
      if(targetEl && targetEl !== dragEl && targetEl.parentElement === container){
        const rect = targetEl.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height/2;
        container.insertBefore(dragEl, before ? targetEl : targetEl.nextSibling);
      }
    });
    const finishDrag = (e)=>{
      if(!dragEl) return;
      try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
      dragEl.classList.remove('dragging');
      const body = document.querySelector('.manage-panel-body');
      const order = [];
      if(body){
        Array.from(body.children).forEach(el=>{
          if(el.classList.contains('manage-block')){
            el.querySelectorAll('.manage-row[data-id]').forEach(r=>order.push(r.getAttribute('data-id')));
          } else if(el.classList.contains('manage-row') && el.getAttribute('data-id')){
            order.push(el.getAttribute('data-id'));
          }
        });
      }
      if(order.length){ compareOrder = order; savePref('compareOrder', compareOrder); }
      dragEl = null;
      render();
    };
    handle.addEventListener('pointerup', finishDrag);
    handle.addEventListener('pointercancel', ()=>{
      if(dragEl){ dragEl.classList.remove('dragging'); dragEl=null; }
    });
  };
  document.querySelectorAll('.manage-row').forEach(row=>{
    const handle = row.querySelector(':scope > .drag-handle');
    if(handle) bindDrag(handle, row);
  });
  document.querySelectorAll('.manage-block').forEach(block=>{
    const handle = block.querySelector('.manage-group-head .drag-handle');
    if(handle) bindDrag(handle, block);
  });
}

function renderPicker(){
  const groups = [];
  const seen = new Set();
  PEOPLE.forEach(p=>{ if(!seen.has(p.group)){ seen.add(p.group); groups.push(p.group); } });
  // Most people opening this are guests, so their card goes at the top.
  const guestIdx = groups.indexOf('Guests');
  if(guestIdx > 0) groups.unshift(groups.splice(guestIdx, 1)[0]);

  let html = `
  <div class="shell">
${renderHero()}
    <div class="content">
      <div class="picker-intro">
        <p>Find your name to see your schedule</p>
      </div>
      <div class="compare-pill-wrap">
        <a class="compare-pill" id="compareLink">Compare everyone's schedule &#8594;</a>
      </div>
  `;

  groups.forEach(g=>{
    const members = PEOPLE.filter(p=>p.group===g && !p.contactOnly);
    if(!members.length) return;
    html += `<div class="group-label">${g}</div><div class="card-grid">`;
    members.forEach(m=>{
      const wide = (m.group==='Guests' || m.id==='planner' || m.id==='mimi') ? ' wide' : '';
      html += `
        <div class="person-card${wide}" data-id="${m.id}">
          <div class="name">${m.name}</div>
          <div class="role">${m.role}</div>
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    </div>
  </div>`;
  return html;
}

function renderPersonal(){
  const p = personById(currentPerson);
  const all = tasksFor(currentPerson);
  const doneCount = all.filter(t=>completed[t.id]).length;
  const todoCount = all.length - doneCount;

  let banner = '';
  if(p.id==='parents_anna'){
    banner = `<div class="banner"><b>Reminder —</b> please arrive together for the 3:00 PM ceremony rehearsal. Only May has a hair &amp; makeup slot, at 11:30 AM — Andre doesn't need to be there for that.</div>`;
  } else if(ALL_PARENTS.includes(p.id)){
    banner = `<div class="banner"><b>Reminder —</b> parents arrive earlier than the rest of the guests, for the 3:00 PM ceremony rehearsal.</div>`;
  } else if(p.id==='mua'){
    banner = `<div class="banner"><b>Note —</b> bridal party service should be confirmed no later than Aug 5 (30 days prior).</div>`;
  } else if(p.id==='planner'){
    banner = `<div class="banner"><b>Setup still needs volunteers —</b> the welcome sign, tables, ceremony fans, and charm bar are listed under you for now. Let Anna know if any should be reassigned to bridal party or family.</div>`;
  }

  const dongNoteLink = p.id==='bm_annad' ? `
      <div class="note-link-card" id="dongNoteLink">
        <div>
          <div class="note-link-title">Dong's personal note/checklist</div>
          <div class="note-link-sub">Pre-wedding prep, route, and packing list</div>
        </div>
        <div class="note-link-arrow">&#8250;</div>
      </div>` : '';

  const packingLink = hasPackingList(p.id) ? `
      <div class="note-link-card" id="packingLink">
        <div>
          <div class="note-link-title">Packing list</div>
          <div class="note-link-sub">What to pack for the wedding day</div>
        </div>
        <div class="note-link-arrow">&#8250;</div>
      </div>` : '';

  let html = `
  <div class="shell">
${renderHero()}
    <div class="content">
      ${banner}
      ${dongNoteLink}
      ${packingLink}
      <div class="section-title">
        <span>${p.name}'s Schedule</span>
        <span class="count-pill">${doneCount} / ${all.length}</span>
      </div>
      ${`<button class="archive-toggle" id="archiveToggle">${showArchive ? 'Hide' : 'Show'} completed (${doneCount})</button>`}
  `;

  const visible = showArchive ? all : all.filter(t=>!completed[t.id]);

  if(visible.length===0){
    html += `<div class="empty-state"><span class="serif">All clear</span>You're all caught up for now.</div>`;
  } else {
    visible.forEach(t=>{
      html += renderTaskRow(t, !!completed[t.id]);
    });
  }

  html += `
      <footer class="note">Lincoln Estate · Saturday, September 5 · Have a beautiful day 🌿</footer>
    </div>
  </div>`;

  if(p.id==='bm_annad' && showDongNote){
    html += renderDongNoteModal();
  }
  if(hasPackingList(p.id) && showPackingList){
    html += renderPackingModal(p.id);
  }

  return html;
}

function renderTaskRow(t, isDone){
  return `
    <div class="task ${isDone?'done':''}" data-id="${t.id}">
      <div class="time">${t.time}</div>
      <div class="body">
        <div class="title">${t.title}</div>
        ${t.note ? `<div class="note">${t.note}</div>` : ''}
      </div>
      <div class="checkbox ${isDone?'checked':''}" data-id="${t.id}">${CHECK_SVG}</div>
    </div>
  `;
}
